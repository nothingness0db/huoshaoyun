<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>晚霞预报 · 图表</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --bg: oklch(0.985 0 0);
    --fg: oklch(0.205 0 0);
    --card: oklch(1 0 0);
    --muted: oklch(0.955 0 0);
    --muted-fg: oklch(0.556 0 0);
    --border: oklch(0.922 0 0);
    --ring: Highlight;
    --c-set: #d97b24;
    --c-rise: #cf4a78;
    --c-cyan: #2f8fc7;
    --c-green: #2f9e63;
    --c-pink: #c2568f;
    --c-blue: #4a7fd6;
    --c-blue-mid: #466aa8;
    --c-blue-lo: #3b5672;
  }
  .dark {
    color-scheme: dark;
    --bg: oklch(0.145 0 0);
    --fg: oklch(0.985 0 0);
    --card: oklch(0.205 0 0);
    --muted: oklch(0.269 0 0);
    --muted-fg: oklch(0.708 0 0);
    --border: oklch(1 0 0 / 10%);
    --c-set: #ffb35c;
    --c-rise: #ff7eb3;
    --c-cyan: #7ec8ff;
    --c-green: #7dffb3;
    --c-pink: #ff9ed1;
    --c-blue: #8fb8ff;
    --c-blue-mid: #5b7fd6;
    --c-blue-lo: #3d5570;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    accent-color: Highlight;
  }
  ::selection { background: Highlight; color: HighlightText; }
  header {
    height: 52px; padding: 0 32px; display: flex; align-items: center;
    justify-content: space-between; border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 15px; font-weight: 600; letter-spacing: 1px;
    display: flex; align-items: center; gap: 9px;
  }
  header h1::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%;
    background: linear-gradient(135deg, var(--c-rise), var(--c-set));
  }
  .city { display: flex; align-items: center; gap: 10px; }
  select {
    background: var(--card); color: var(--fg); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 10px; font-size: 14px; font-family: inherit;
    outline: none;
  }
  select:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  #city-label { color: var(--muted-fg); font-size: 13px; }
  nav { display: flex; gap: 2px; padding: 0 32px; border-bottom: 1px solid var(--border); }
  nav button {
    appearance: none; border: 0; background: transparent; font: inherit; font-size: 14px;
    color: var(--muted-fg); padding: 12px 14px; cursor: pointer; position: relative;
    transition: color .15s ease;
  }
  nav button:hover { color: var(--fg); }
  nav button.active { color: var(--fg); font-weight: 600; }
  nav button::after {
    content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px;
    border-radius: 1px; background: linear-gradient(90deg, var(--c-rise), var(--c-set));
    opacity: 0; transition: opacity .15s ease;
  }
  nav button.active::after { opacity: 1; }
  main { padding: 0 32px 32px; }
  .panel { display: none; }
  .panel.active { display: block; }
  .toolbar { display: flex; gap: 6px; align-items: center; padding: 16px 0 4px; }
  .toolbar .label { color: var(--muted-fg); font-size: 13px; margin-right: 4px; }
  .toolbar button {
    appearance: none; border: 1px solid var(--border); background: transparent;
    color: var(--muted-fg); font: inherit; font-size: 13px; padding: 5px 12px;
    border-radius: 6px; cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .toolbar button:hover { background: var(--muted); color: var(--fg); }
  .toolbar button.active { color: var(--fg); background: var(--muted); }
  .chart { width: 100%; height: 380px; margin-top: 10px; }
  .chart.tall { height: 320px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 10px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 16px 0; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; }
  .card .k { color: var(--muted-fg); font-size: 13px; }
  .card .v { font-size: 26px; font-weight: 700; color: var(--c-set); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .card .v.dim { color: var(--muted-fg); font-size: 16px; }
  .card .sub { font-size: 12px; color: var(--muted-fg); margin-top: 4px; }
  .panelbox { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; margin-top: 14px; }
  .panelbox h3 { font-size: 13px; font-weight: 600; color: var(--muted-fg); margin-bottom: 8px; }
  .panelbox .row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed var(--border); font-size: 14px; font-variant-numeric: tabular-nums; }
  .panelbox .row:last-child { border-bottom: none; }
  .panelbox .s { color: var(--c-set); font-weight: 700; }
  .note { font-size: 12px; color: var(--muted-fg); line-height: 1.7; margin-top: 8px; }
  #sat-img { max-width: 100%; border-radius: 8px; border: 1px solid var(--border); display: none; margin-top: 4px; }
  .theme-toggle {
    display: grid; place-items: center; width: 28px; height: 28px;
    border: 1px solid transparent; border-radius: 6px; background: transparent;
    color: var(--muted-fg); cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .theme-toggle:hover { background: var(--muted); color: var(--fg); }
  .theme-toggle:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .theme-toggle svg { width: 16px; height: 16px; }
  .icon-moon { display: block; }
  .icon-sun { display: none; }
  .dark .icon-moon { display: none; }
  .dark .icon-sun { display: block; }
  @media (prefers-reduced-motion: reduce) {
    nav button, nav button::after, .toolbar button, .theme-toggle { transition: none; }
  }
</style>
</head>
<body>
<header>
  <h1>晚霞 / 朝霞 指数</h1>
  <span class="city">
    <select id="city-select"></select>
    <span id="city-label"></span>
    <button id="theme-toggle" class="theme-toggle" aria-label="切换主题" title="切换主题">
      <svg class="icon-moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M13.2 9.8A5.6 5.6 0 1 1 6.2 2.8a4.6 4.6 0 0 0 7 7Z"/></svg>
      <svg class="icon-sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><path d="M8 .5v2M8 13.5v2M.5 8h2M13.5 8h2M2.4 2.4l1.4 1.4M12.2 12.2l1.4 1.4M13.6 2.4l-1.4 1.4M3.8 12.2l-1.4 1.4"/></svg>
    </button>
  </span>
</header>
<nav>
  <button class="active" data-p="forecast">未来预报</button>
  <button data-p="verify">实况验证</button>
  <button data-p="season">季节分析</button>
  <button data-p="track">追踪复盘</button>
</nav>
<main>
  <div id="forecast" class="panel active">
    <div class="toolbar">
      <span class="label">预报天数</span>
      <button data-days="1">1</button><button data-days="3">3</button>
      <button data-days="5">5</button><button data-days="7" class="active">7</button>
    </div>
    <div class="grid">
      <div class="chart" id="c-score"></div>
      <div class="chart" id="c-factors"></div>
    </div>
  </div>
  <div id="verify" class="panel">
    <div class="cards" id="verify-cards"></div>
    <div class="chart tall" id="c-verify"></div>
    <div class="panelbox" id="verify-sat">
      <h3>日落时刻卫星云图 (FY-4B 可见光, 中央气象台)</h3>
      <img id="sat-img" alt="卫星云图">
      <div class="note" id="sat-note"></div>
    </div>
    <div class="note">
      实况分 = 用模型近实时分析场（过去 48 小时）重新计算的分数，与气象站实测非常接近。<br>
      卫星云图是客观观测：日落时刻西边有没有云、云往哪飘，看图一目了然。
    </div>
  </div>
  <div id="season" class="panel">
    <div class="chart tall" id="c-season"></div>
    <div class="panelbox" id="season-top"></div>
  </div>
  <div id="track" class="panel">
    <div class="cards" id="track-cards"></div>
    <div class="chart tall" id="c-track"></div>
  </div>
</main>
<script>
const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const charts = {};
function mk(id) {
  const c = echarts.init(document.getElementById(id));
  charts[id] = c;
  window.addEventListener("resize", () => c.resize());
  return c;
}
const base = () => ({
  backgroundColor: "transparent",
  textStyle: { color: cssVar("--muted-fg") },
  legend: { textStyle: { color: cssVar("--muted-fg") }, top: 4 },
  grid: { left: 56, right: 56, top: 44, bottom: 34 },
  tooltip: { trigger: "axis" },
});
async function get(p) { return (await fetch(p)).json(); }
const fv = v => v == null ? "--" : v;
let CITY = "";
let ACTIVE_DAYS = 7;

async function loadForecast(days) {
  const d = await get("/api/forecast?days=" + days + "&city=" + CITY);
  const f = d.factors;
  mk("c-score").setOption({
    ...base(),
    title: { text: "朝霞 / 晚霞 指数 (0-10)", textStyle: { fontSize: 13, color: cssVar("--muted-fg") } },
    xAxis: { type: "category", data: d.dates, axisLabel: { color: cssVar("--muted-fg") } },
    yAxis: { type: "value", min: 0, max: 10, splitLine: { lineStyle: { color: cssVar("--border") } } },
    series: [
      { name: "朝霞", type: "bar", data: d.rise, itemStyle: { color: cssVar("--c-rise"), borderRadius: [4, 4, 0, 0] }, barGap: "15%" },
      { name: "晚霞", type: "bar", data: d.set, itemStyle: { color: cssVar("--c-set"), borderRadius: [4, 4, 0, 0] } },
    ],
  });
  mk("c-factors").setOption({
    ...base(),
    title: { text: "日落时段因子 (云量 %, 湿度 %, AOD)", textStyle: { fontSize: 13, color: cssVar("--muted-fg") } },
    legend: { data: ["高云", "中云", "低云", "湿度", "AOD"] },
    tooltip: {
      trigger: "axis", axisPointer: { type: "shadow" },
      formatter: p => {
        const i = p[0].dataIndex, fac = f[i];
        return `<b>${d.dates[i]}</b> 日落 ${d.set_time[i]} 晚霞 ${d.set[i].toFixed(1)}/10 (${d.set_grade[i]})<br>`
          + `高云 ${fv(fac[0])}% · 中云 ${fv(fac[1])}% · 低云 ${fv(fac[2])}%<br>`
          + `湿度 ${fv(fac[3])}% · 降水 ${fv(fac[4])}% · AOD ${fv(fac[5])}`;
      },
    },
    xAxis: { type: "category", data: d.dates, axisLabel: { color: cssVar("--muted-fg") } },
    yAxis: [{ type: "value", min: 0, max: 100, splitLine: { lineStyle: { color: cssVar("--border") } } },
            { type: "value", min: 0, max: 2, splitLine: { show: false } }],
    series: [
      { name: "高云", type: "bar", stack: "c", data: f.map(x => x[0]), itemStyle: { color: cssVar("--c-blue") } },
      { name: "中云", type: "bar", stack: "c", data: f.map(x => x[1]), itemStyle: { color: cssVar("--c-blue-mid") } },
      { name: "低云", type: "bar", stack: "c", data: f.map(x => x[2]), itemStyle: { color: cssVar("--c-blue-lo") } },
      { name: "湿度", type: "line", data: f.map(x => x[3]), itemStyle: { color: cssVar("--c-green") }, smooth: true, symbol: "circle" },
      { name: "AOD", type: "line", yAxisIndex: 1, connectNulls: false, data: f.map(x => x[5]), itemStyle: { color: cssVar("--c-pink") }, smooth: true, symbol: "circle" },
    ],
  });
}

async function loadVerify() {
  const d = await get("/api/verify?city=" + CITY);
  const rows = d.rows;
  const card = (k, v, sub, dim) =>
    `<div class="card"><div class="k">${k}</div><div class="v ${dim ? "dim" : ""}">${v}</div><div class="sub">${sub || ""}</div></div>`;
  const today = rows[rows.length - 1], yday = rows[rows.length - 2];
  const diff = (r) => {
    if (!r || r.pred_set == null) return { v: "--", s: "未记录预报" };
    const df = r.actual_set - r.pred_set;
    return { v: (df > 0 ? "+" : "") + df.toFixed(1), s: df >= 1 ? "超出预期" : df <= -1 ? "不及预期" : "基本一致" };
  };
  document.getElementById("verify-cards").innerHTML =
    card("今日晚霞 · 预报", today && today.pred_set != null ? today.pred_set.toFixed(1) + "/10" : "--",
         "预报来自 17:00 快照", !today || today.pred_set == null) +
    card("今日晚霞 · 实况", today ? today.actual_set.toFixed(1) + "/10" : "--", "近实时分析场", !today) +
    card("今日偏差", diff(today).v, diff(today).s, false) +
    card("昨日晚霞 · 实况", yday ? yday.actual_set.toFixed(1) + "/10" : "--",
         yday && yday.pred_set != null ? "预报 " + yday.pred_set.toFixed(1) + "/10" : "未记录预报", !yday);
  mk("c-verify").setOption({
    ...base(),
    title: { text: "近 3 天晚霞: 预报 vs 实况", textStyle: { fontSize: 13, color: cssVar("--muted-fg") } },
    legend: { data: ["预报 (末次快照)", "实况"] },
    xAxis: { type: "category", data: rows.map(r => r.date), axisLabel: { color: cssVar("--muted-fg") } },
    yAxis: { type: "value", min: 0, max: 10, splitLine: { lineStyle: { color: cssVar("--border") } } },
    series: [
      { name: "预报 (末次快照)", type: "bar", data: rows.map(r => r.pred_set), itemStyle: { color: cssVar("--c-cyan"), borderRadius: [4, 4, 0, 0] }, barGap: "15%" },
      { name: "实况", type: "bar", data: rows.map(r => r.actual_set), itemStyle: { color: cssVar("--c-set"), borderRadius: [4, 4, 0, 0] } },
    ],
  });
  const satEl = document.getElementById("sat-img"), noteEl = document.getElementById("sat-note");
  if (d.sat) {
    satEl.src = d.sat.url + "?t=" + Date.now();
    satEl.style.display = "block";
    noteEl.textContent = `${d.sat.date} 日落时刻云图 · 图像时间 ${d.sat.ts} · 珠海在图中央偏南`;
  } else {
    satEl.style.display = "none";
    noteEl.textContent = "今天还没有卫星图。运行: python track.py sat 抓取日落时刻云图 (自动任务每天 19:30 执行)";
  }
}

async function loadSeason() {
  const d = await get("/api/season?city=" + CITY);
  mk("c-season").setOption({
    ...base(),
    title: { text: `季节分析 (近 5 年, 共 ${d.total_days} 天)`, textStyle: { fontSize: 13, color: cssVar("--muted-fg") } },
    legend: { data: ["平均晚霞分", "≥8分占比"] },
    xAxis: { type: "category", data: d.months.map(m => m.month + "月"), axisLabel: { color: cssVar("--muted-fg") } },
    yAxis: [{ type: "value", max: 10, splitLine: { lineStyle: { color: cssVar("--border") } } },
            { type: "value", max: 15, splitLine: { show: false } }],
    series: [
      { name: "平均晚霞分", type: "bar", data: d.months.map(m => m.avg), itemStyle: { color: cssVar("--c-set"), borderRadius: [4, 4, 0, 0] } },
      { name: "≥8分占比", type: "line", yAxisIndex: 1, data: d.months.map(m => m.pct8), itemStyle: { color: cssVar("--c-cyan") }, smooth: true, symbol: "circle" },
    ],
  });
  document.getElementById("season-top").innerHTML =
    "<h3>历史最佳晚霞日 TOP 10</h3>" +
    d.top.map(t => `<div class="row"><span>${t.date}</span><span class="s">${t.score.toFixed(1)}/10</span></div>`).join("");
}

async function loadTrack() {
  const d = await get("/api/track?city=" + CITY);
  const s = d.stats;
  const card = (k, v, sub, dim) =>
    `<div class="card"><div class="k">${k}</div><div class="v ${dim ? "dim" : ""}">${v}</div><div class="sub">${sub || ""}</div></div>`;
  document.getElementById("track-cards").innerHTML =
    card("对比样本", s.n + " 天", "已补实况的历史日", s.n === 0) +
    card("首报误差 MAE", s.mae_first ?? "--", "首次记录 vs 实况") +
    card("末报误差 MAE", s.mae_last ?? "--", "当天前最后一次 vs 实况") +
    card("预报≥7 命中率", s.hit_rate == null ? "--" : s.hit_rate + "%", s.hit_rate == null ? "暂无数据" : `(${s.hit7}/${s.pred7} 命中: 报≥7 且实况≥6)`);
  const rows = d.rows;
  mk("c-track").setOption({
    ...base(),
    title: { text: "预报 vs 实况 (晚霞)", textStyle: { fontSize: 13, color: cssVar("--muted-fg") } },
    legend: { data: ["首报", "末报", "实况"] },
    xAxis: { type: "category", data: rows.map(r => r.date), axisLabel: { color: cssVar("--muted-fg"), rotate: 30 } },
    yAxis: { type: "value", min: 0, max: 10, splitLine: { lineStyle: { color: cssVar("--border") } } },
    series: [
      { name: "首报", type: "bar", data: rows.map(r => r.first), itemStyle: { color: cssVar("--c-blue-mid"), borderRadius: [4, 4, 0, 0] } },
      { name: "末报", type: "bar", data: rows.map(r => r.last), itemStyle: { color: cssVar("--c-cyan"), borderRadius: [4, 4, 0, 0] } },
      { name: "实况", type: "bar", data: rows.map(r => r.actual), itemStyle: { color: cssVar("--c-set"), borderRadius: [4, 4, 0, 0] } },
    ],
  });
}

document.querySelectorAll("nav button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll("nav button").forEach(x => x.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    const p = b.dataset.p;
    document.getElementById(p).classList.add("active");
    const id = { forecast: "c-score", verify: "c-verify", season: "c-season", track: "c-track" }[p];
    if (charts[id]) charts[id].resize();
  };
});
document.querySelectorAll(".toolbar button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll(".toolbar button").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    ACTIVE_DAYS = Number(b.dataset.days);
    loadForecast(ACTIVE_DAYS);
  };
});

const root = document.documentElement;
let dark = false;
function applyTheme(next, reload) {
  dark = next;
  root.classList.toggle("dark", dark);
  try { localStorage.setItem("theme", dark ? "dark" : "light"); } catch {}
  if (reload) reloadAll();
}
document.getElementById("theme-toggle").onclick = () => applyTheme(!dark, true);
let storedTheme = null;
try { storedTheme = localStorage.getItem("theme"); } catch {}
applyTheme(storedTheme ? storedTheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches, false);

const reloadAll = () => Promise.all([loadForecast(ACTIVE_DAYS), loadVerify(), loadSeason(), loadTrack()]);

(async () => {
  const cities = (await get("/api/cities")).cities;
  if (!cities.length) {
    document.getElementById("city-label").textContent = "无监控城市, 先运行 track.py addcity";
    return;
  }
  const sel = document.getElementById("city-select");
  cities.forEach(c => {
    const o = document.createElement("option");
    o.value = c.name;
    o.textContent = c.name;
    sel.appendChild(o);
  });
  const label = document.getElementById("city-label");
  const reload = async () => {
    CITY = sel.value;
    label.textContent = `(${cities.find(c => c.name === sel.value).lat}°N, ${cities.find(c => c.name === sel.value).lon}°E)`;
    await reloadAll();
  };
  sel.onchange = reload;
  await reload();
})();
</script>
</body>
</html>
